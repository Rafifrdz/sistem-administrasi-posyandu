services:
  - type: web
    name: posyandu-ibu-hamil
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: "Posyandu Digital"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false          # tempel APP_KEY dari DEPLOY.md
      - key: APP_URL
        sync: false          # isi URL Render setelah service dibuat
      - key: APP_LOCALE
        value: id
      - key: APP_TIMEZONE
        value: Asia/Jakarta
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning

      # ── Database (Neon) ──
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false          # tempel connection string UNPOOLED dari Neon
      - key: DB_SSLMODE
        value: require

      # ── Driver lain ──
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: local
